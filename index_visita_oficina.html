<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Visita — Oficina</title>
  <link rel="stylesheet" href="style.css">
  <script src="form-utils.js"></script>
</head>
<body>
  <div class="container">
    <img src="imagens/logo.png" alt="Logo da Unidas" class="logo">

    <div class="alerta-login">
      <h5>⚠️ ATENÇÃO ⚠️</h5>
      <h1>É necessário estar logado com uma conta do Google e utilizar o navegador Google Chrome.</h1>
    </div>

    <div class="card" id="card-0">
      <h2>Registro de Visita Oficina</h2>
      <p>Selecione o tipo de oficina e clique em <strong>Iniciar</strong> para registrar sua visita.</p>

      <div class="input-group">
        <label for="tipo-oficina">Tipo de Oficina</label>
        <select id="tipo-oficina" name="tipo_oficina" required>
          <option value="" disabled selected>Selecione um tipo de oficina</option>
          <option value="Interna">Interna</option>
          <option value="Externa">Externa</option>
          <option value="Movel">Móvel</option>
        </select>
      </div>

      <div class="navigation-buttons">
        <button type="button" class="start-btn" id="btn-iniciar">Iniciar</button>
      </div>
    </div>
  </div>

  <script>
    const _key = (k) => `visita_oficina__${k}`;

    // Bloqueia fora do horário permitido (07:30–18:30), com liberação por senha para testes
    const SENHA_LIBERACAO_HORARIO = '27/08';

    (function() {
      if (AppStorage.get('bypass_horario')) return; // já liberado nesta sessão

      const agora    = new Date();
      const total    = agora.getHours() * 60 + agora.getMinutes();
      const inicio   = 7 * 60 + 30;
      const fim      = 18 * 60 + 30;
      if (total < inicio || total > fim) {
        const h = String(agora.getHours()).padStart(2,'0');
        const m = String(agora.getMinutes()).padStart(2,'0');
        document.querySelector('.container').innerHTML = `
          <img src="imagens/logo.png" alt="Logo da Unidas" class="logo">
          <div class="card" style="text-align:center;padding:48px 24px;">
            <div style="font-size:3rem;margin-bottom:16px;">🔒</div>
            <h2>Fora do Horário</h2>
            <p style="color:var(--text-muted);">
              O preenchimento está disponível apenas das <strong>07:30</strong> às <strong>18:30</strong>.<br>
              Horário atual: <strong>${h}:${m}</strong>
            </p>
            <div class="input-group" style="text-align:left;margin-top:24px;">
              <label for="senha-liberacao">Senha de liberação (uso interno/testes)</label>
              <input type="password" id="senha-liberacao" placeholder="Digite a senha"
                style="width:100%;box-sizing:border-box;padding:11px 14px;border:1.5px solid var(--border, #ccc);border-radius:8px;font-size:.95rem;">
            </div>
            <button type="button" class="start-btn" id="btn-liberar">Liberar</button>
            <p id="erro-senha" style="color:#c0392b;font-size:.82rem;display:none;margin-top:8px;">Senha incorreta.</p>
          </div>`;

        function tentarLiberar() {
          const valor = document.getElementById('senha-liberacao').value.trim();
          if (valor === SENHA_LIBERACAO_HORARIO) {
            AppStorage.set('bypass_horario', true);
            window.location.reload();
          } else {
            document.getElementById('erro-senha').style.display = 'block';
          }
        }
        document.getElementById('btn-liberar').addEventListener('click', tentarLiberar);
        document.getElementById('senha-liberacao').addEventListener('keydown', (e) => {
          if (e.key === 'Enter') tentarLiberar();
        });
      }
    })();

    document.getElementById('btn-iniciar')?.addEventListener('click', () => {
      const sel = document.getElementById('tipo-oficina');
      if (!sel.value) {
        sel.classList.add('error');
        sel.focus();
        return;
      }
      sel.classList.remove('error');
      sessionStorage.setItem(_key('tipo_oficina'), JSON.stringify(sel.value));
      window.location.href = sel.value === 'Externa'
        ? 'oficina_externa.html'
        : 'oficina_interna_movel.html';
    });

    // Aviso de visita pendente: dados já preenchidos numa sessão anterior que
    // não chegaram a ser confirmados (queda de conexão, app fechado, etc.).
    // Funciona independente do horário — não é o início de uma nova visita.
    (function() {
      const backup = typeof LocalBackup !== 'undefined' ? LocalBackup.obter() : null;
      if (!backup) return;

      const detalhe = backup.nomeOficina ? ` — ${backup.nomeOficina}` : '';
      const horaEnvio = backup.criadoEm ? new Date(backup.criadoEm).toLocaleString('pt-BR') : '';

      const banner = document.createElement('div');
      banner.style.cssText = 'background:#fff9e6;border:1.5px solid #f0d080;border-radius:var(--radius-sm);padding:16px 18px;margin-bottom:16px;text-align:center;';
      banner.innerHTML = `
        <p style="margin:0 0 10px;font-size:.88rem;color:#7a5a00;">
          ⚠️ Você tem uma visita${detalhe} não confirmada${horaEnvio ? ' (' + horaEnvio + ')' : ''}.
          Seus dados continuam salvos neste aparelho.
        </p>
        <div style="display:flex;gap:8px;">
          <button type="button" id="banner-reenviar" style="flex:1;background:#0051AA;color:#fff;border:none;border-radius:8px;padding:11px;font-size:.9rem;font-weight:600;cursor:pointer;">🔄 Reenviar agora</button>
          <button type="button" id="banner-descartar" style="background:none;border:1px solid #ccc;border-radius:8px;padding:11px 14px;font-size:.9rem;cursor:pointer;color:#666;">Descartar</button>
        </div>
      `;
      document.querySelector('.container').prepend(banner);

      document.getElementById('banner-reenviar').addEventListener('click', async (e) => {
        const btn = e.currentTarget;
        btn.disabled = true;
        btn.textContent = 'Reenviando…';
        const resultado = await tentarReenviarBackup();
        AppStorage.set('submit_result', resultado);
        window.location.href = 'sucesso.html';
      });

      document.getElementById('banner-descartar').addEventListener('click', () => {
        if (confirm('Descartar essa visita pendente? Os dados salvos neste aparelho serão apagados.')) {
          LocalBackup.limpar();
          banner.remove();
        }
      });
    })();
  </script>
</body>
</html>
