<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro Enviado</title>
  <link rel="stylesheet" href="style.css">
  <script src="form-utils.js"></script>
  <style>
    .retry-box {
      background: #fff9e6;
      border: 1.5px solid #f0d080;
      border-radius: var(--radius-sm);
      padding: 16px 18px;
      margin: 4px 0 20px;
      text-align: center;
    }
    .retry-box p {
      margin: 0 0 12px;
      font-size: .88rem;
      color: #7a5a00;
    }
    .retry-btn {
      background: #0051AA;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    .retry-btn:disabled { opacity: .6; cursor: default; }
    .status-cards {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 24px 0;
    }

    .status-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      border-radius: var(--radius-sm);
      border: 1.5px solid;
      font-size: .95rem;
      font-weight: 500;
    }

    .status-card.ok {
      background: #f0faf4;
      border-color: #a3d9b1;
      color: #1a5c30;
    }

    .status-card.erro {
      background: #fff4f4;
      border-color: #f5a8a8;
      color: #7a1f1f;
    }

    .status-card.desconhecido {
      background: #fffbf0;
      border-color: #f0d080;
      color: #7a5a00;
    }

    .status-card .status-icon {
      font-size: 1.5rem;
      flex-shrink: 0;
    }

    .status-card .status-text strong {
      display: block;
      font-size: .85rem;
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 2px;
      opacity: .7;
    }

    .status-card .status-text span {
      font-size: 1rem;
    }

    .status-card.erro .retry-hint {
      display: block;
      font-size: .8rem;
      margin-top: 4px;
      opacity: .75;
    }

    .success-title {
      font-family: var(--font-head);
      font-size: 1.4rem;
      color: var(--text);
      text-align: center;
      margin-bottom: 4px;
    }

    .success-sub {
      text-align: center;
      color: var(--text-muted);
      font-size: .9rem;
      margin-bottom: 0;
    }

    .loading-indicator {
      text-align: center;
      color: var(--text-muted);
      font-size: .9rem;
      padding: 24px 0;
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .4; }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="imagens/logo.png" alt="Logo da Unidas" class="logo">

    <div class="card" id="resultado-card">
      <div class="loading-indicator" id="loading">Verificando resultado…</div>
    </div>

    <div class="navigation-buttons" style="justify-content:center; margin-top: 16px;">
      <button type="button" class="next-btn" id="novo-btn" style="max-width:220px; display:none;">
        Nova Visita
      </button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const card    = document.getElementById('resultado-card');
      const loading = document.getElementById('loading');
      const novoBtn = document.getElementById('novo-btn');

      const infoPlanilha = {
        ok:          { cls: 'ok',          icon: '📊', msg: 'Registro salvo na planilha' },
        erro:        { cls: 'erro',        icon: '📊', msg: 'Falha ao salvar na planilha' },
        desconhecido:{ cls: 'desconhecido',icon: '📊', msg: 'Não foi possível confirmar o salvamento' },
      };
      const infoEmail = {
        ok:          { cls: 'ok',          icon: '📧', msg: 'E-mail enviado para a equipe' },
        processando: { cls: 'desconhecido',icon: '📧', msg: 'E-mail sendo enviado', hint: 'Chega em alguns minutos.' },
        erro:        { cls: 'erro',        icon: '📧', msg: 'Falha ao enviar o e-mail', hint: 'Será reenviado automaticamente quando a cota liberar.' },
        desconhecido:{ cls: 'desconhecido',icon: '📧', msg: 'Não foi possível confirmar o envio do e-mail' },
      };
      const infoPdf = {
        ok:          { cls: 'ok',          icon: '📄', msg: 'Laudo em PDF gerado' },
        processando: { cls: 'desconhecido',icon: '📄', msg: 'Laudo sendo gerado', hint: 'Chega em alguns minutos.' },
        erro:        { cls: 'erro',        icon: '📄', msg: 'Falha ao gerar o laudo em PDF' },
        desconhecido:{ cls: 'desconhecido',icon: '📄', msg: 'Não foi possível confirmar o laudo em PDF' },
      };

      function renderCard(info) {
        return `
          <div class="status-card ${info.cls}">
            <span class="status-icon">${info.icon}</span>
            <div class="status-text">
              <span>${info.msg}</span>
              ${info.hint ? `<span class="retry-hint">${info.hint}</span>` : ''}
            </div>
          </div>`;
      }

      function renderizar(resultado) {
        const { planilha, email, pdf, erro } = resultado;
        const confirmado = resultado.confirmado !== false; // undefined = compatibilidade com formato antigo
        const backup     = LocalBackup.obter();
        const pendente    = !!backup;

        const planilhaOk      = planilha === 'ok';
        const aindaProcessando = email === 'processando' || pdf === 'processando';

        const tituloIcon  = !confirmado ? '⏳' : planilhaOk ? '✅' : '❌';
        const tituloTexto = !confirmado
          ? 'Envio não confirmado'
          : planilhaOk ? 'Registro enviado com sucesso!' : 'Algo deu errado';

        const subtexto = !confirmado
          ? 'Não conseguimos confirmar se os dados chegaram ao servidor.'
          : planilhaOk
            ? (aindaProcessando
                ? 'Dados salvos na planilha. Fotos, laudo em PDF e e-mail estão sendo processados — chegam em alguns minutos.'
                : 'Planilha atualizada, e-mail enviado e laudo gerado.')
            : 'Não foi possível confirmar o salvamento do registro.';

        const ip   = infoPlanilha[planilha] || infoPlanilha.desconhecido;
        const ie   = infoEmail[email]       || infoEmail.desconhecido;
        const ipdf = pdf ? (infoPdf[pdf] || infoPdf.desconhecido) : null;

        let retryBox = '';
        if (pendente) {
          const detalhe = backup.nomeOficina ? ` — ${backup.nomeOficina}` : '';
          retryBox = `
            <div class="retry-box">
              <p>Visita${detalhe} ainda não confirmada. Seus dados continuam salvos neste aparelho — é seguro tentar novamente.</p>
              <button type="button" class="retry-btn" id="retry-btn">🔄 Tentar novamente</button>
            </div>`;
        }

        card.innerHTML = `
          <div style="text-align:center; margin-bottom:8px; font-size:2.2rem;">${tituloIcon}</div>
          <h2 class="success-title">${tituloTexto}</h2>
          <p class="success-sub">${subtexto}</p>
          ${retryBox}
          <div class="status-cards">
            ${renderCard(ip)}
            ${renderCard(ie)}
            ${ipdf ? renderCard(ipdf) : ''}
          </div>
          ${erro ? `<p style="font-size:.78rem;color:var(--text-muted);text-align:center;margin-top:4px;">Detalhe técnico: ${erro}</p>` : ''}
        `;

        const retryBtn = document.getElementById('retry-btn');
        if (retryBtn) {
          retryBtn.addEventListener('click', async () => {
            retryBtn.disabled = true;
            retryBtn.textContent = 'Reenviando…';
            const novoResultado = await tentarReenviarBackup();
            AppStorage.set('submit_result', novoResultado);
            renderizar(novoResultado);
          });
        }

        novoBtn.style.display = pendente ? 'none' : 'block';
      }

      const resultado = AppStorage.get('submit_result') || { planilha: 'desconhecido', email: 'desconhecido', pdf: 'desconhecido', confirmado: false };
      AppStorage.remove('submit_result');

      loading.remove();
      renderizar(resultado);

      novoBtn.addEventListener('click', () => {
        AppStorage.remove('tipo_oficina');
        window.location.href = 'index_visita_oficina.html';
      });
    });
  </script>
</body>
</html>
